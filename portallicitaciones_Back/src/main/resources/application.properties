############################################
# BASE DE DATOS
############################################
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=portallicitaciones;encrypt=false;trustServerCertificate=true
spring.datasource.username=mnko
spring.datasource.password=Madelman18

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.jdbc=TRACE


# ✅ IMPORTANTE: Evita que Hibernate/Spring conviertan nombres a snake_case
# (si no, licitacionesNacional -> licitaciones_nacional)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

############################################
# ACTUATOR
############################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

############################################
# EUSKADI – OpenData Contratación
############################################
euskadi.api.base-url=https://api.euskadi.eus

############################################
# CATALUÑA – OpenData Socrata (SODA)
############################################
# Base URL del portal Open Data de Cataluña
catalunya.api.base-url=https://analisi.transparenciacatalunya.cat

# Tamaño de página para descargas (máx recomendado por Socrata)
catalunya.import.limit=50000

# Máximo de páginas por ejecución (protección contra descargas masivas)
catalunya.import.max-pages=30

# Ventana diaria por defecto (ayer + hoy)
catalunya.import.days-back-default=1

